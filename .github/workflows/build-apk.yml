name: Build & Release Selaris Flutter APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
      is_mandatory:
        description: 'Force update? (true/false/auto). "auto" = preserve nilai di version.json (kalau version match), fallback false.'
        required: false
        default: 'auto'
      release_notes:
        description: 'Release notes. Kosong = preserve dari version.json (kalau version match), fallback "Bug fixes and improvements".'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        run: flutter pub get
        working-directory: kasir_app

      - name: Generate Code (Build Runner)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: kasir_app

      - name: Recreate Platform Directories
        run: |
          flutter create --org com.selaris --project-name selaris_pos .
          rm -rf test/widget_test.dart
        working-directory: kasir_app

      - name: Generate Ikon Aplikasi
        # WAJIB sesudah `flutter create` — perintah itu selalu nulis ulang
        # mipmap dengan ikon Flutter bawaan (logo biru). Tanpa langkah ini,
        # APK rilis keluar dengan ikon Flutter, bukan ikon Kasira.
        run: dart run flutter_launcher_icons
        working-directory: kasir_app

      - name: Patch AndroidManifest — wajib INTERNET permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "=== Manifest sebelum patch ==="
          cat $MANIFEST
          # Tulis ulang manifest dengan permissions lengkap
          cat > $MANIFEST << 'MANIFEST_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <!-- Android 13+ minta izin notifikasi saat berjalan. Tanpa baris
                   ini, dialog izinnya nggak pernah muncul dan push diam. -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="Selaris"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2"/>
                  <!-- Channel yang dipakai notifikasi dari FCM. Nilainya HARUS sama
                       dengan `_channelId` di push_service.dart dan `CHANNEL_ID` di
                       backend/services/fcm.py. Beda = Android jatuh ke channel
                       cadangan yang nggak nongol di layar. -->
                  <meta-data
                      android:name="com.google.firebase.messaging.default_notification_channel_id"
                      android:value="pesanan_online"/>
              </application>
          </manifest>
          MANIFEST_EOF
          echo "=== Manifest setelah patch ==="
          cat $MANIFEST
        working-directory: kasir_app

      # ── Firebase Cloud Messaging ─────────────────────────────────────────
      # Folder android/ TIDAK ada di repo: `flutter create` di atas bikin
      # ulang dari nol tiap build. Jadi SEMUA berkas Firebase harus dipasang
      # di sini, sesudah langkah itu — sama alasannya dengan patch manifest
      # dan ikon aplikasi.
      #
      # Rahasianya opsional. Kalau GOOGLE_SERVICES_JSON belum diisi, langkah
      # ini dilewati dan APK tetap kebentuk; push-nya saja yang mati
      # (`Firebase.initializeApp()` dilempar dan ditangkap PushService).
      # Ini yang bikin main tetap hijau sebelum proyek Firebase-nya jadi.
      - name: Pasang google-services.json
        id: firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ada=false" >> $GITHUB_OUTPUT
            echo "::warning::GOOGLE_SERVICES_JSON kosong — APK dibangun TANPA notifikasi push."
            exit 0
          fi
          # Terima dua bentuk: JSON mentah, atau base64 (buat rahasia yang
          # ke-mangle newline-nya).
          if echo "$GOOGLE_SERVICES_JSON" | head -c 1 | grep -q '{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          fi
          # applicationId POS dan Dapur sekarang BEDA (dua listing Play).
          # Plugin google-services nolak build kalau paketnya nggak terdaftar,
          # jadi dicek di sini: kurang satu = seluruh Firebase dilewati dan
          # APK tetap kebentuk (tanpa push), bukan build yang mati.
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open('android/app/google-services.json'))
          paket = [c['client_info']['android_client_info']['package_name'] for c in d['client']]
          print('project:', d['project_info']['project_id'])
          print('paket terdaftar:', paket)
          # Dicek PER APP, bukan semua-atau-tidak: kalau Dapur belum didaftarkan
          # di Firebase, POS tetap dapat push. Versi pertama aturan ini minta
          # kedua paket sekaligus, dan satu yang kurang bikin DUA-DUANYA
          # kehilangan push tanpa alasan.
          out = os.environ['GITHUB_OUTPUT']
          ada_pos = 'com.selaris.pos' in paket
          ada_dapur = 'com.selaris.dapur' in paket
          if not ada_pos:
              print('::warning::google-services.json belum punya com.selaris.pos. '
                    'Tambahkan app Android itu di Firebase Console, unduh ulang '
                    'berkasnya, perbarui secret GOOGLE_SERVICES_JSON. '
                    'Build ini jalan TANPA notifikasi push.')
              os.remove('android/app/google-services.json')
              open(out, 'a').write('ada=false\ndapur=false\n')
          else:
              if not ada_dapur:
                  print('::warning::com.selaris.dapur belum terdaftar di Firebase. '
                        'APK POS dapat push, APK Dapur dibangun tanpa push.')
              open(out, 'a').write(f'ada=true\ndapur={str(ada_dapur).lower()}\n')
          PY
        working-directory: kasir_app

      - name: Patch Gradle — plugin google-services
        # Desugaring PISAH ke langkah berikutnya: dia syarat
        # flutter_local_notifications 22.x, jadi harus jalan walau Firebase
        # dilewati. Dulu keduanya satu langkah bersyarat, dan build tanpa
        # Firebase langsung mati di desugaring.
        if: steps.firebase.outputs.ada == 'true'
        run: |
          set -e
          SETTINGS="android/settings.gradle.kts"
          APP="android/app/build.gradle.kts"

          # 1. Daftarkan plugin di settings (blok `plugins`, apply false).
          python3 - "$SETTINGS" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          baris = '    id("com.google.gms.google-services") version "4.4.3" apply false\n'
          if "google-services" not in s:
              anchor = '    id("com.android.application")'
              i = s.index(anchor)
              j = s.index("\n", i) + 1
              s = s[:j] + baris + s[j:]
              open(p, "w").write(s)
          print(open(p).read())
          PY

          # 2. Terapkan plugin di modul app + nyalakan desugaring
          #    (syarat flutter_local_notifications 22.x).
          python3 - "$APP" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          if "google-services" not in s:
              anchor = '    id("dev.flutter.flutter-gradle-plugin")'
              s = s.replace(anchor, anchor + '\n    id("com.google.gms.google-services")', 1)
          open(p, "w").write(s)
          print(open(p).read())
          PY
        working-directory: kasir_app

      - name: Patch Gradle — desugaring (selalu)
        run: |
          python3 - android/app/build.gradle.kts <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          if "isCoreLibraryDesugaringEnabled" not in s:
              s = s.replace(
                  "    compileOptions {",
                  "    compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
          if "coreLibraryDesugaring(" not in s:
              s = s.rstrip() + '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          open(p, "w").write(s)
          PY
        working-directory: kasir_app

      # ── Tanda tangan rilis ────────────────────────────────────────────────
      # Tanpa langkah ini Flutter nandatangani rilis pakai DEBUG KEY, dan Play
      # nolak mentah-mentah. `android/` dibikin ulang tiap build, jadi
      # keystore-nya diinject dari secret, sama seperti google-services.json.
      # Secret kosong = balik ke debug key + peringatan, main tetap hijau.
      - name: Pasang upload keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ada=false" >> $GITHUB_OUTPUT
            echo "::warning::ANDROID_KEYSTORE_BASE64 kosong — rilis ditandatangani DEBUG KEY. Bisa di-sideload, TAPI Play Store nolak."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          PROPS
          python3 - android/app/build.gradle.kts <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          if "keystoreProperties" not in s:
              header = (
                  'import java.util.Properties\n'
                  'import java.io.FileInputStream\n\n'
                  'val keystoreProperties = Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              s = header + s
              s = s.replace(
                  "    buildTypes {",
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            keyAlias = keystoreProperties["keyAlias"] as String\n'
                  '            keyPassword = keystoreProperties["keyPassword"] as String\n'
                  '            storeFile = file(keystoreProperties["storeFile"] as String)\n'
                  '            storePassword = keystoreProperties["storePassword"] as String\n'
                  '        }\n'
                  '    }\n\n'
                  '    buildTypes {', 1)
              s = s.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")', 1)
          open(p, "w").write(s)
          PY
          grep -n "signingConfig" android/app/build.gradle.kts
          echo "ada=true" >> $GITHUB_OUTPUT
        working-directory: kasir_app

      - name: Update version in pubspec.yaml
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BUILD_NUMBER="${{ github.run_number }}"
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
        working-directory: kasir_app

      - name: Analyze Dart Code
        continue-on-error: true
        run: flutter analyze
        working-directory: kasir_app

      # POS dan Dapur sekarang DUA app terpisah di Play (`com.selaris.pos`
      # dan `com.selaris.dapur`). Dulu keduanya keluar dengan applicationId
      # yang sama, jadi nggak bisa dipasang barengan di satu HP, nggak bisa
      # jadi dua listing, dan cek versi `packageName.contains('dapur')` di
      # splash nggak pernah cocok.
      #
      # `namespace` (paket kode) SENGAJA dibiarkan `com.selaris.selaris_pos`:
      # yang dilihat Play itu applicationId, dan mengubah namespace berarti
      # mindahin MainActivity.kt juga.
      - name: Build POS (APK + AAB)
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i 's/^\( *applicationId = \).*/\1"com.selaris.pos"/' android/app/build.gradle.kts
          grep -n 'applicationId' android/app/build.gradle.kts
          flutter build apk --release --target lib/main.dart
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/selaris-pos-v${VERSION}.apk
          flutter build appbundle --release --target lib/main.dart
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/selaris-pos-v${VERSION}.aab
        working-directory: kasir_app

      - name: Build Dapur (APK + AAB)
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Plugin google-services MEMATIKAN build kalau applicationId-nya nggak
          # ada di google-services.json. Jadi kalau Dapur belum didaftarkan,
          # Firebase dicopot khusus build ini: APK tetap jadi, push-nya saja
          # yang mati (`Firebase.initializeApp()` dilempar, ditangkap PushService).
          # Dapur dibangun TERAKHIR, jadi nggak perlu dipasang balik.
          if [ "${{ steps.firebase.outputs.ada }}" = "true" ] && [ "${{ steps.firebase.outputs.dapur }}" != "true" ]; then
            echo "::warning::Dapur dibangun tanpa Firebase (paket belum terdaftar)."
            rm -f android/app/google-services.json
            sed -i '/com.google.gms.google-services/d' android/app/build.gradle.kts
          fi
          sed -i 's/^\( *applicationId = \).*/\1"com.selaris.dapur"/' android/app/build.gradle.kts
          # Nama yang kelihatan di layar HP. POS dan Dapur sekarang bisa
          # kepasang barengan di satu tablet, jadi dua-duanya nggak boleh
          # nulis "Selaris" doang.
          sed -i 's/android:label="Selaris"/android:label="Selaris Dapur"/' android/app/src/main/AndroidManifest.xml
          grep -n 'applicationId' android/app/build.gradle.kts
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml
          flutter build apk --release --target lib/main_dapur.dart
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/selaris-dapur-v${VERSION}.apk
          flutter build appbundle --release --target lib/main_dapur.dart
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/selaris-dapur-v${VERSION}.aab
        working-directory: kasir_app

      # Bukti, bukan asumsi: kalau ini nulis "Android Debug", AAB-nya bakal
      # ditolak Play dan lebih baik ketahuan di sini daripada di Play Console.
      - name: Verifikasi tanda tangan
        run: |
          VERSION="${{ github.event.inputs.version }}"
          APK="build/app/outputs/flutter-apk/selaris-pos-v${VERSION}.apk"
          python3 - "$APK" <<'PY'
          import sys
          data = open(sys.argv[1], 'rb').read()
          debug = b'Android Debug' in data
          print('APK Signing Block:', 'ADA' if data.rfind(b'APK Sig Block 42') > 0 else 'TIDAK ADA')
          print('ditandatangani debug key:', debug)
          if debug:
              print('::error::APK masih ditandatangani DEBUG KEY. Play Store bakal nolak. '
                    'Cek secret ANDROID_KEYSTORE_BASE64.')
              sys.exit(1)
          PY
        if: steps.signing.outputs.ada == 'true'
        working-directory: kasir_app

      # ── Generate version.json → commit ke repo (Flutter baca via raw.githubusercontent.com) ──
      - name: Generate & Commit version.json
        id: gen_version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          IS_MANDATORY="${{ github.event.inputs.is_mandatory }}"
          NOTES="${{ github.event.inputs.release_notes }}"
          REPO="muhivan752/Kasira-OS-Intelligence"
          BASE_URL="https://github.com/${REPO}/releases/download/v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          # Resolve is_mandatory + release_notes:
          # - "auto"/kosong → pakai existing version.json kalau version match, else default
          # - nilai eksplisit → pakai itu (overwrite)
          if [ -f version.json ]; then
            EXISTING_VERSION=$(jq -r '.pos.version // ""' version.json)
            EXISTING_MANDATORY=$(jq -r '.pos.is_mandatory // false' version.json)
            EXISTING_NOTES=$(jq -r '.pos.release_notes // ""' version.json)
          else
            EXISTING_VERSION=""
            EXISTING_MANDATORY="false"
            EXISTING_NOTES=""
          fi

          if [ "$IS_MANDATORY" = "auto" ]; then
            if [ "$EXISTING_VERSION" = "$VERSION" ]; then
              IS_MANDATORY="$EXISTING_MANDATORY"
              echo "is_mandatory preserved from existing version.json: $IS_MANDATORY"
            else
              IS_MANDATORY="false"
              echo "is_mandatory fallback to false (version bump or no existing)"
            fi
          fi

          if [ -z "$NOTES" ]; then
            if [ "$EXISTING_VERSION" = "$VERSION" ] && [ -n "$EXISTING_NOTES" ] && [ "$EXISTING_NOTES" != "null" ]; then
              NOTES="$EXISTING_NOTES"
              echo "release_notes preserved from existing version.json"
            else
              NOTES="Bug fixes and improvements"
              echo "release_notes fallback to default"
            fi
          fi

          cat > version.json <<EOF
          {
            "pos": {
              "version": "${VERSION}",
              "is_mandatory": ${IS_MANDATORY},
              "download_url": "${BASE_URL}/selaris-pos-v${VERSION}.apk",
              "release_notes": "${NOTES}"
            },
            "dapur": {
              "version": "${VERSION}",
              "is_mandatory": ${IS_MANDATORY},
              "download_url": "${BASE_URL}/selaris-dapur-v${VERSION}.apk",
              "release_notes": "${NOTES}"
            }
          }
          EOF

          git add version.json
          git commit -m "chore: update version.json → v${VERSION}" || echo "No changes to commit"
          git push origin main || echo "Push failed, continuing to release"

          # Expose resolved values untuk step "Create GitHub Release" (multi-line safe)
          echo "is_mandatory=${IS_MANDATORY}" >> $GITHUB_OUTPUT
          {
            echo "release_notes<<NOTES_EOF"
            echo "${NOTES}"
            echo "NOTES_EOF"
          } >> $GITHUB_OUTPUT

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Selaris-Release-APKs-v${{ github.event.inputs.version }}
          path: |
            kasir_app/build/app/outputs/flutter-apk/selaris-pos-v${{ github.event.inputs.version }}.apk
            kasir_app/build/app/outputs/flutter-apk/selaris-dapur-v${{ github.event.inputs.version }}.apk
            kasir_app/build/app/outputs/bundle/release/selaris-pos-v${{ github.event.inputs.version }}.aab
            kasir_app/build/app/outputs/bundle/release/selaris-dapur-v${{ github.event.inputs.version }}.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Selaris v${{ github.event.inputs.version }}
          body: |
            ## Selaris v${{ github.event.inputs.version }}

            ${{ steps.gen_version.outputs.release_notes }}

            ### Info Update
            - **Force Update**: ${{ steps.gen_version.outputs.is_mandatory }}
            - **Build**: #${{ github.run_number }}
            - **Platform**: Android

            ### APK yang Tersedia
            | APK | Deskripsi |
            |-----|-----------|
            | `selaris-pos-v*.apk` | Aplikasi kasir utama (POS), pasang langsung dari HP |
            | `selaris-dapur-v*.apk` | Aplikasi layar dapur, pasang langsung dari HP |
            | `selaris-pos-v*.aab` | Paket untuk diunggah ke Google Play (POS) |
            | `selaris-dapur-v*.aab` | Paket untuk diunggah ke Google Play (Dapur) |

            ### version.json URL (untuk Flutter update checker)
            ```
            https://raw.githubusercontent.com/muhivan752/Kasira-OS-Intelligence/main/version.json
            ```

            ### Cara Install
            1. Download APK yang sesuai
            2. Aktifkan "Install dari sumber tidak dikenal" di pengaturan Android
            3. Install APK
          draft: false
          prerelease: false
          files: |
            kasir_app/build/app/outputs/flutter-apk/selaris-pos-v${{ github.event.inputs.version }}.apk
            kasir_app/build/app/outputs/flutter-apk/selaris-dapur-v${{ github.event.inputs.version }}.apk
            kasir_app/build/app/outputs/bundle/release/selaris-pos-v${{ github.event.inputs.version }}.aab
            kasir_app/build/app/outputs/bundle/release/selaris-dapur-v${{ github.event.inputs.version }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
